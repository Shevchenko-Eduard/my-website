services:
  nginx:
    build:
      dockerfile: nginx.dockerfile
    env_file: ./nginx.env
    network_mode: host
    image: nginx:latest
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./check_environment.sh:/docker-entrypoint.d/40-check_environment.sh:ro
      - nginx-logs:/var/log/nginx/

  aumsu:
    # build:
    #   context: https://github.com/Shevchenko-Eduard/Aumsu.git
    #   dockerfile: Dockerfile
    #   args:
    #     NUXT_PUBLIC_SITE_URL: https://${DOMAIN}
    #     # NUXT_PUBLIC_SITE_URL: http://localhost
    image: shedward/aumsu-frontend:latest
    ports:
      - "${PORT_AUMSU}:${PORT_AUMSU}"
    environment:
      PORT: ${PORT_AUMSU}
      HOST: 0.0.0.0
      TZ: ${TZ:-Europe/Moscow}
    restart: unless-stopped

volumes:
  nginx-logs:
